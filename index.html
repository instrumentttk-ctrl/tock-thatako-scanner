<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Thatako Lab - QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#f5f7fb; color:#1f2937; }
    .container { max-width:480px; margin:auto; padding:20px; }
    h2 { margin-bottom:5px; }
    .subtitle { color:#6b7280; margin-top:0; margin-bottom:20px; }
    .card { background:#fff; border-radius:18px; padding:16px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
    #reader { width:100%; overflow:hidden; border-radius:14px; }
    .status { margin-top:15px; padding:14px; border-radius:12px; background:#eef2ff; text-align:center; line-height:1.5; }
    .success { background:#ecfdf5; color:#166534; }
    .error { background:#fef2f2; color:#b91c1c; }
    .lot { font-size:20px; font-weight:bold; margin-top:7px; }
    button { width:100%; padding:14px; margin-top:15px; border:0; border-radius:12px; background:#2563eb; color:#fff; font-size:16px; font-weight:bold; }
  </style>
</head>
<body>
<div class="container">
  <h2>📷 สแกน QR น้ำยา</h2>
  <p class="subtitle">Stock Thatako Lab</p>

  <div class="card">
    <div id="reader"></div>
    <div id="status" class="status">กำลังเตรียมกล้อง...</div>
    <button onclick="startScanner()">เปิดกล้องอีกครั้ง</button>
  </div>
</div>

<script>
let scanner = null;
let scanned = false;

const params = new URLSearchParams(window.location.search);
const returnUrl = params.get("return");

function setStatus(html, type = "") {
  const el = document.getElementById("status");
  el.className = "status" + (type ? " " + type : "");
  el.innerHTML = html;
}

function sendBack(lotId) {
  if (!returnUrl) {
    setStatus(
      '✅ อ่าน QR สำเร็จ<div class="lot">' + lotId + '</div>' +
      '<br>ไม่พบที่อยู่ Stock สำหรับส่งกลับ',
      "success"
    );
    return;
  }

  try {
    const url = new URL(returnUrl);
    url.searchParams.set("lotId", lotId);

    setStatus(
      '✅ อ่าน QR สำเร็จ<div class="lot">' + lotId + '</div><br>กำลังกลับไปที่ Stock...',
      "success"
    );

    setTimeout(function () {
      window.location.href = url.toString();
    }, 450);

  } catch (e) {
    setStatus("❌ ที่อยู่ Stock ไม่ถูกต้อง", "error");
  }
}

async function startWithCamera(cameraConfig) {
  scanner = new Html5Qrcode("reader");

  await scanner.start(
    cameraConfig,
    {
      fps: 10,
      qrbox: { width: 250, height: 250 },
      aspectRatio: 1.0
    },
    function(decodedText) {
      if (scanned) return;

      const value = String(decodedText || "").trim().toUpperCase();

      if (!value.startsWith("LOT-")) {
        setStatus("⚠️ QR นี้ไม่ใช่ LotID ของระบบ Stock", "error");
        return;
      }

      scanned = true;

      scanner.stop()
        .catch(function(){})
        .finally(function() {
          sendBack(value);
        });
    },
    function() {}
  );
}

async function startScanner() {
  scanned = false;
  setStatus("กำลังเปิดกล้อง...");

  try {
    if (scanner) {
      try { await scanner.stop(); } catch (e) {}
      try { await scanner.clear(); } catch (e) {}
      scanner = null;
    }

    // วิธีหลัก: ขอ "กล้องหลัง" แบบไม่บังคับ exact
    try {
      await startWithCamera({ facingMode: "environment" });
      setStatus("✅ เปิดกล้องแล้ว กรุณาจ่อ QR ให้อยู่ในกรอบ");
      return;
    } catch (firstError) {
      // ถ้าเครื่องไม่รองรับ facingMode ให้เลือกกล้องจากรายการแทน
      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error("ไม่พบกล้องในอุปกรณ์");
      }

      let chosen = cameras[0];

      // พยายามเลือกกล้องหลังจากชื่อกล้อง
      const backCamera = cameras.find(function(cam) {
        const label = String(cam.label || "").toLowerCase();
        return (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment") ||
          label.includes("หลัง")
        );
      });

      if (backCamera) chosen = backCamera;
      else if (cameras.length > 1) chosen = cameras[cameras.length - 1];

      await startWithCamera(chosen.id);
      setStatus("✅ เปิดกล้องแล้ว กรุณาจ่อ QR ให้อยู่ในกรอบ");
    }

  } catch (error) {
    const msg = String(error && error.message ? error.message : error);

    setStatus(
      "❌ เปิดกล้องไม่สำเร็จ<br><br>" +
      "กรุณาตรวจว่า Chrome อนุญาต Camera ให้เว็บไซต์นี้แล้ว<br><br>" +
      "<small>" + msg + "</small>",
      "error"
    );
  }
}

window.addEventListener("load", startScanner);
</script>
</body>
</html>
