<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stock Thatako Lab - QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937}
.container{max-width:480px;margin:auto;padding:20px}h2{margin-bottom:5px}.subtitle{color:#6b7280;margin-top:0;margin-bottom:20px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
#reader{width:100%;overflow:hidden;border-radius:14px}.status{margin-top:15px;padding:14px;border-radius:12px;background:#eef2ff;text-align:center;line-height:1.5}
.success{background:#ecfdf5;color:#166534}.error{background:#fef2f2;color:#b91c1c}.lot{font-size:20px;font-weight:bold;margin-top:7px}
button{width:100%;padding:14px;margin-top:15px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<div class="container"><h2>📷 สแกน QR น้ำยา</h2><p class="subtitle">Stock Thatako Lab</p>
<div class="card"><div id="reader"></div><div id="status" class="status">กำลังเตรียมกล้อง...</div>
<button onclick="startScanner()">เปิดกล้องอีกครั้ง</button></div></div>
<script>
let scanner=null,scanned=false;
const params=new URLSearchParams(location.search);
const returnUrl=params.get("return");
function status(html,type=""){const e=document.getElementById("status");e.className="status "+type;e.innerHTML=html}
function sendBack(lotId){
 if(!returnUrl){status('✅ อ่าน QR สำเร็จ<div class="lot">'+lotId+'</div><br>ไม่พบที่อยู่ Stock สำหรับส่งกลับ',"success");return}
 try{
   const u=new URL(returnUrl);
   u.searchParams.set("lotId",lotId);
   status('✅ อ่าน QR สำเร็จ<div class="lot">'+lotId+'</div><br>กำลังกลับไปที่ Stock...',"success");
   setTimeout(()=>location.href=u.toString(),450);
 }catch(e){status("❌ ที่อยู่ Stock ไม่ถูกต้อง","error")}
}
function startScanner(){
 scanned=false;status("กำลังเปิดกล้อง...");
 try{if(scanner)scanner.clear()}catch(e){}
 scanner=new Html5Qrcode("reader");
 scanner.start({facingMode:{exact:"environment"}},{fps:10,qrbox:{width:250,height:250},aspectRatio:1},
 function(decodedText){
   if(scanned)return;
   const value=String(decodedText||"").trim().toUpperCase();
   if(!value.startsWith("LOT-")){status("⚠️ QR นี้ไม่ใช่ LotID ของระบบ Stock","error");return}
   scanned=true;
   scanner.stop().catch(()=>{}).finally(()=>sendBack(value));
 },function(){}).catch(e=>status("❌ เปิดกล้องไม่สำเร็จ<br>"+String(e),"error"));
}
addEventListener("load",startScanner);
</script>
</body>
</html>
